<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | My Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../UI-Stylings/style.css" rel="stylesheet">
</head>
<body data-page="auth">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card auth-card shadow-lg w-100">
            <div class="card-body p-4 p-md-5">
                <a class="text-decoration-none fw-bold text-primary" href="../login/login.html">MY TODOS</a>
                <h1 class="h3 mt-4 mb-2">Create your account</h1>
                <p class="text-secondary mb-4">A clear mind starts with one small task.</p>
                <div id="auth-message" class="alert alert-danger d-none" role="alert"></div>
                <form id="register-form">
                    <div class="mb-3">
                        <label class="form-label" for="register-email">Email address</label>
                        <input class="form-control form-control-lg" type="email" id="register-email" autocomplete="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="register-password">Password</label>
                        <input class="form-control form-control-lg" type="password" id="register-password" autocomplete="new-password" minlength="6" required>
                        <div class="form-text">Use at least 6 characters.</div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit" data-label="Create account">Create account</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="../login/login.html">Sign in</a></p>
            </div>
        </section>
    </main>
    <script type="module" src="../index.js"></script>
</body>
</html>
