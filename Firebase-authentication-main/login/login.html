<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | My Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../UI-Stylings/style.css" rel="stylesheet">
</head>
<body data-page="auth">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card auth-card shadow-lg w-100">
            <div class="card-body p-4 p-md-5">
                <a class="text-decoration-none fw-bold text-primary" href="../login/login.html">MY TODOS</a>
                <h1 class="h3 mt-4 mb-2">Welcome back</h1>
                <p class="text-secondary mb-4">Sign in to pick up where you left off.</p>
                <div id="auth-message" class="alert alert-danger d-none" role="alert"></div>
                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label" for="login-email">Email address</label>
                        <input class="form-control form-control-lg" type="email" id="login-email" autocomplete="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="login-password">Password</label>
                        <input class="form-control form-control-lg" type="password" id="login-password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit" data-label="Sign in">Sign in</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">New here? <a href="../signup/signup.html">Create an account</a></p>
            </div>
        </section>
    </main>
    <script type="module" src="../index.js"></script>
</body>
</html>
