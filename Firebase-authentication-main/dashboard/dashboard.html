<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../UI-Stylings/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">
    <nav class="navbar border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="./dashboard.html">MY TODOS</a>
            <div class="d-flex align-items-center gap-3">
                <span id="greeting-text" class="text-secondary small d-none d-sm-inline"></span>
                <button id="logout" class="btn btn-outline-secondary btn-sm" type="button">Sign out</button>
            </div>
        </div>
    </nav>
    <main class="container dashboard-main py-5">
        <div class="mb-4">
            <p class="text-primary fw-semibold mb-1">YOUR SPACE</p>
            <h1 class="display-6 fw-bold mb-2">Today's focus</h1>
            <p class="text-secondary mb-0">Keep it simple. One task at a time.</p>
        </div>
        <div id="dashboard-message" class="alert alert-danger d-none" role="alert"></div>
        <section class="card todo-card shadow-sm mb-4">
            <div class="card-body p-3 p-md-4">
                <form id="todo-form" class="row g-2">
                    <div class="col">
                        <label class="visually-hidden" for="todo-input">New todo</label>
                        <input id="todo-input" class="form-control form-control-lg" type="text" maxlength="200" placeholder="What needs to get done?" required>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary btn-lg" type="submit">Add task</button>
                    </div>
                </form>
            </div>
        </section>
        <section class="card todo-card shadow-sm">
            <div class="card-body p-3 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0">Your tasks</h2>
                    <span id="todo-count" class="badge rounded-pill text-bg-light">0 tasks</span>
                </div>
                <p id="todo-loading" class="text-secondary mb-0">Loading your tasks...</p>
                <ul id="todo-list" class="list-unstyled mb-0"></ul>
                <p id="todo-empty" class="text-secondary text-center py-4 mb-0 d-none">No tasks yet. Add one above to get started.</p>
            </div>
        </section>
    </main>
    <script type="module" src="../index.js"></script>
    <script type="module" src="./dashboard.js"></script>
</body>
</html>
