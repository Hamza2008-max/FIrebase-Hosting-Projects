<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="Heading"><h1>FireBase-Hosting</h1></div>

    <style>
        body {
            /* Set full viewport height */
            min-height: 100vh;

            /* Standard linear gradient (Direction, Color 1, Color 2) */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            /* Ensure the background doesn't repeat if content is short */
            background-repeat: no-repeat;

            /* Remove default browser spacing */
            margin: 0;
        }

        .Heading{
            text-align: center;
            padding-top: 12.5%;
            box-sizing: border-box;
            color: black;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: larger;
        }
    </style>
</body>

</html>
